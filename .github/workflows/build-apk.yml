name: Build Nexora Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Restore Keystore & Environment Configuration
        run: |
          # Restore debug.keystore from base64 if present
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          # Create .env from template if missing
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

          # If repository secret GEMINI_API_KEY exists, inject it into .env
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android APK with Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-AI-Assistant-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
