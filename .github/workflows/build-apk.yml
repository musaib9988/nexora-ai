name: Build & Deploy Nexora Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Update Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Restore Keystore & Environment Configuration
        run: |
          # Restore debug.keystore from base64 if present
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          # Create .env from template if missing
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

          # If repository secret GEMINI_API_KEY exists, inject it into .env
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android APK with Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Files
        run: |
          mkdir -p public
          cp app/build/outputs/apk/debug/app-debug.apk public/nexora-ai.apk
          cp app/build/outputs/apk/debug/app-debug.apk nexora-ai.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-AI-Assistant-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish to GitHub Releases (latest)
        uses: softprops/action-gh-release@v2
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && !contains(github.event.head_commit.message, '[skip ci]')
        with:
          tag_name: latest
          name: "Nexora AI Latest APK"
          body: |
            ### 🚀 Nexora AI Automated Build
            This release is automatically updated on every push to the repository.
            - **Commit**: ${{ github.sha }}
            - **File**: `nexora-ai.apk`
          files: nexora-ai.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Updated APK to Repository for Instant Vercel Deployment
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && !contains(github.event.head_commit.message, '[skip ci]')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/nexora-ai.apk nexora-ai.apk
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update Nexora APK for Vercel hosting [skip ci]"
            git push origin ${{ github.ref_name }}
          fi
